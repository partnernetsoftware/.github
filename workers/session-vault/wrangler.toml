# Override name at deploy: CLOUDFLARE_WORKER_NAME=session-vault npx wrangler deploy
name = "session-vault"
main = "src/index.ts"
compatibility_date = "2024-11-01"

[durable_objects]
bindings = [
  { name = "SESSION_VAULT", class_name = "SessionVaultDO" },
  { name = "REGISTRY", class_name = "RegistryDO" },
]

[[migrations]]
tag = "v1"
new_classes = ["SessionVaultDO", "RegistryDO"]

[vars]
# Non-secret defaults; override owner via ?owner= query
