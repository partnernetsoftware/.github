# Cloudflare Workers — mcp-cf-bots (deploy dir: workers/mcp-cf-bots/)
# Override worker name: CLOUDFLARE_WORKER_NAME=... npx wrangler deploy
name = "mcp-cf-bots"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

[durable_objects]
bindings = [
  { name = "SESSION_STORE", class_name = "SessionStoreDO" },
  { name = "REGISTRY", class_name = "RegistryDO" },
  { name = "MEMORY_STORE", class_name = "MemoryDO" },
]

[[kv_namespaces]]
binding = "TOKENS"
id = "ac6b8cef3cbe4d5fa315c2ed1106e04d"

[[migrations]]
tag = "v1"
new_classes = ["SessionVaultDO", "RegistryDO"]

[[migrations]]
tag = "v2"
renamed_classes = [{ from = "SessionVaultDO", to = "SessionStoreDO" }]

[[migrations]]
tag = "v3"
new_classes = ["MemoryDO"]

[ai]
binding = "AI"

# Vectorize accelerator — run ./scripts/setup-rag.sh (needs index + Vectorize Edit token)
[[vectorize]]
binding = "MEM_VECTORS"
index_name = "mcp-cf-bots-mem"

# Non-secret config — override per env (dashboard / wrangler vars put / CI).
# Secrets (wrangler secret put): VAULT_TOKEN, optional ENCRYPTION_KEY
[vars]
MCP_HTTP_PATH = "/mcp"
MCP_SERVER_NAME = "mcp-cf-bots"
MCP_SERVER_VERSION = "0.7.2"
MAX_BODY_BYTES = "2000000"
MCP_SERVER_DESCRIPTION = "Cloudflare MCP for cross-agent bots"
MCP_PROTOCOL_VERSION = "2024-11-05"
OWNER_HEADER = "X-Cf-Bots-Owner"
DEFAULT_OWNER = "cloud-agent"
DEFAULT_SESSION_SOURCE = "browser-use"
# MCP_ALLOWED_ORIGINS = "https://cursor.com"
