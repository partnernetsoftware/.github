name: mcp-cf-bots

on:
  push:
    paths:
      - "workers/mcp-cf-bots/**"
      - ".github/workflows/mcp-cf-bots.yml"
  pull_request:
    paths:
      - "workers/mcp-cf-bots/**"
      - ".github/workflows/mcp-cf-bots.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/mcp-cf-bots
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/mcp-cf-bots/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
