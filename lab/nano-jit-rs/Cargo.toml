[package]
name = "nano-jit-rs"
version = "0.1.0"
edition = "2021"
description = "nanolisp.com — portable Lisp .lbin VM, multi-target CLI (Rust)"
license = "MIT"

[[bin]]
name = "nanolisp"
path = "src/main.rs"

[dependencies]
libloading = "0.8"
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
