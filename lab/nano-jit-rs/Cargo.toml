[package]
name = "nano-jit-rs"
version = "0.1.0"
edition = "2021"
description = "Rust rewrite of nano-jit.com — portable .lbin VM, multi-target CLI"
license = "MIT"

[[bin]]
name = "nano-jit"
path = "src/main.rs"

[dependencies]
libloading = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
