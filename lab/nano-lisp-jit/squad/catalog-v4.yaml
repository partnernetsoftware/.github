# v4 kickoff — squad/v2（与 v3.5 catalog 分离）
apiVersion: squad/v2
project:
  root: ..
  state_db: .squad/state-v4.db
  state_file: .squad/state-v4.json
locking:
  backend: sqlite
roles:
  reviewer: { kind: meta, workflow: reviewer }
  commander: { kind: orchestrator, workflow: commander }
  engineer-a: { kind: worker, workflow: worker }
  engineer-b: { kind: worker, workflow: worker }
dispatch:
  assign_to: [engineer-a, engineer-b]
  max_per_wave: 2
supervisor:
  team_mode: true
  auto_exec: true
  auto_done: true
  timeout_sec: 7200
  poll_interval_sec: 15
  max_waves: 50
  task_timeout_sec: 3600
  stuck_policy: fail
signoff:
  id: v4-slice0-scoped
  require_terminal: false
  gates:
    - id: v35-regression-run
      check: results
      file: ".build/results.txt"
      results_key: tests.pass
      min_pass: 257
    - id: v35-regression-build
      check: results
      file: ".build/nano-jit/bootstrap-report.txt"
      results_key: build.pass
      min_pass: 119
    - id: v4-readme
      check: artifact
      path_glob: "v4/README.md"
    - id: v4-kickoff-plan
      check: artifact
      path_glob: "samples/bootstrap-v4-kickoff.lisp"
    - id: v4-aarch64-scout-elf
      check: artifact
      path_glob: ".build/bootstrap-v4-aarch64-add-scout.elf"
    - id: v4-squad-dispatch-plan
      check: artifact
      path_glob: "samples/bootstrap-v4-squad-dispatch.lisp"
    - id: v4-squad-run-loop-once-plan
      check: artifact
      path_glob: "samples/bootstrap-v4-squad-run-loop-once.lisp"
    - id: v4-slice0-evidence
      check: results
      file: ".build/v4-slice0.evidence"
      results_key: v4.slice0
      min_pass: 1

tasks:
  v4-aarch64-aot-plan:
    assign_role: engineer-a
    priority: P0
    touch_paths: ["v3.5/AARCH64.md", "lab/lispjit-ir/nano_bootstrap.c"]
    accept:
      - "bootstrap-v4-aarch64-aot-plan.lisp 样例"
      - "REFLECTION 记 v4 slice-0 范围"
  v4-squad-lisp-sketch:
    assign_role: engineer-b
    priority: P1
    touch_paths: ["v4/README.md", "squad/PROTOCOL.md"]
    accept:
      - "PROTOCOL 或 v4 文档：Lisp 编排替代 Python 的步骤列表"
  wave-v4-R0:
    assign_role: reviewer
    priority: meta
    depends: [v4-aarch64-aot-plan, v4-squad-lisp-sketch]
    accept:
      - "ROADMAP v4 节点"
      - "assess v4-kickoff ready"
  wave-practice-auto-exec-doc:
    assign_role: engineer-b
    priority: P1
    touch_paths: ["tools/squad/README.md", "squad/PROTOCOL.md"]
    accept:
      - "文档说明 --auto-exec 与 verify flock"
  wave-practice-v4-squad-md:
    assign_role: engineer-a
    priority: P1
    touch_paths: ["v4/README.md", "v4/SQUAD.md"]
    accept:
      - "v4 README 记 squad 实践波次"
      - "sync-md 更新 SQUAD.md"
  wave-practice-R1:
    assign_role: reviewer
    priority: meta
    depends: [wave-practice-auto-exec-doc, wave-practice-v4-squad-md]
    accept:
      - "assess v4-kickoff ready"
      - "POSTMORTEM 链实践记录一句"
  wave2-squad-triple-exit:
    assign_role: engineer-b
    priority: P1
    touch_paths: ["tools/squad/README.md", "squad/PROTOCOL.md"]
    accept:
      - "退出语义仅 complete|failed|timeout"
      - "max_iter 映射 timeout；auto_done 文档"
  wave2-v4-s0-assess-sample:
    assign_role: engineer-a
    priority: P1
    touch_paths: ["samples/bootstrap-v4-squad-assess.lisp", "v4/README.md"]
    accept:
      - "bootstrap-v4-squad-assess.lisp S0 smoke"
  wave2-v4-R:
    assign_role: reviewer
    priority: meta
    depends: [wave2-squad-triple-exit, wave2-v4-s0-assess-sample]
    accept:
      - "assess v4-kickoff ready"
      - "REFLECTION wave2 三态+auto_done 实践"
  wave3-v4-squad-samples:
    assign_role: engineer-b
    priority: P0
    touch_paths:
      - "samples/bootstrap-v4-squad-dispatch.lisp"
      - "samples/bootstrap-v4-squad-run-loop-once.lisp"
      - "run.sh"
    accept:
      - "run-bootstrap-v4-squad-dispatch-plan"
      - "run-bootstrap-v4-squad-run-loop-once-plan"
  wave3-v4-slice0-evidence:
    assign_role: engineer-a
    priority: P0
    touch_paths:
      - "samples/bootstrap-v4-slice0-evidence.lisp"
      - ".build/v4-slice0.evidence"
      - "run.sh"
    accept:
      - "run-bootstrap-v4-slice0-evidence-plan"
      - "v4.slice0=1 in evidence"
  wave3-v4-R:
    assign_role: reviewer
    priority: meta
    depends: [wave3-v4-squad-samples, wave3-v4-slice0-evidence]
    accept:
      - "assess v4-slice0-scoped ready"
      - "v4/README 记 slice-0 scoped 完成"
      - "DECISION v3.5 CLOSED"

verify:
  commands:
    - script: run.sh
      cwd: .
      fail_on_nonzero: true

sync:
  board:
    file: v4/SQUAD.md
    template: board
    begin: "<!-- SQUAD_STATE_BEGIN -->"
    end: "<!-- SQUAD_STATE_END -->"
