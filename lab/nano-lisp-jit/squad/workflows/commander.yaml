# 指挥长 C · 微工作流
role: C
name: 指挥长
inputs:
  - squad/catalog.yaml
  - .squad/state.json
steps:
  - id: supervise-loop
    action: cli
    cmd: "squad supervise"
    note: "while：assess→dispatch→等 A/B 信号；仅 complete|failed|timeout 退出"
  - id: supervise-tick
    action: cli
    cmd: "squad supervise --once"
    note: "单 tick（CI/Cloud Agent 轮询用）"
  - id: assess
    action: cli
    cmd: "squad assess"
    branch:
      exit_0: stop-squad
      exit_1: dispatch
  - id: stop-squad
    action: cli
    cmd: "squad halt --reason 'v3.5 signoff 100%'"
  - id: dispatch
    action: cli
    cmd: "squad dispatch --max-tasks 2"
    note: "由 supervise 内嵌；单独跑仅调试"
  - id: publish-orders
    action: cli
    cmd: "squad sync-md --targets squad-board"
  - id: set-merge-order
    action: edit-state
    field: merge_order
    value: ["A", "B", "R"]
outputs:
  - .squad/state.json
  - ../v3.5/SQUAD.md  # 派单板由 state 生成
loop: "每 wave 结束或 A/B done 后重复 assess"
