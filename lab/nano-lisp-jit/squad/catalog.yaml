# v3.5 签收清单 — 机器可读（squad/v2）
apiVersion: squad/v2
project:
  root: ..
  state_db: .squad/state.db
  state_file: .squad/state.json
locking:
  backend: sqlite
  busy_timeout_ms: 30000
  retry:
    max_attempts: 10
    backoff_base_ms: 50
    backoff_max_ms: 2000
roles:
  reviewer: { kind: meta, workflow: reviewer }
  commander: { kind: orchestrator, workflow: commander }
  engineer-a: { kind: worker, workflow: worker }
  engineer-b: { kind: worker, workflow: worker }
dispatch:
  assign_to: [engineer-a, engineer-b]
  max_per_wave: 2
# 指挥长 supervise：while 直到 complete | failed | timeout（禁止 dispatch 一轮即停）
supervisor:
  team_mode: true
  timeout_sec: 7200
  poll_interval_sec: 15
  max_waves: 50
  max_iter: 500
  task_timeout_sec: 3600
  stuck_policy: fail
signoff:
  id: v3.5-lisp-only
  percent_cap: 100
  gates:
    - id: gen5-no-c
      check: artifact
      path_glob: "samples/bootstrap-v35-selfhost-gen5.lisp"
      plan_must_not_match: '\\.c'
    - id: gen5-dual-arch-pack
      check: artifact
      path_glob: "samples/bootstrap-v35-selfhost-gen5.lisp"
      plan_must_match: 'build-slice-lisp'
      plan_must_not_match: 'genesis/nano-jit'
    - id: l4-tu-link
      check: artifact
      path_glob: "samples/bootstrap-v35-lisp-tu-link.lisp"
    - id: tests-run
      check: results
      file: ".build/results.txt"
      results_key: tests.pass
      min_pass: 253
    - id: tests-build
      check: results
      file: ".build/nano-jit/bootstrap-report.txt"
      results_key: build.pass
      min_pass: 119
    - id: aarch64-real-codegen
      check: results
      file: ".build/v35-signoff.evidence"
      results_key: v35.aarch64_add_emit
      min_pass: 1
    - id: l4-full-runner-slice
      check: results
      file: ".build/v35-signoff.evidence"
      results_key: v35.gen5_lisp_runner
      min_pass: 1

tasks:
  L2-companion:
    assign_role: engineer-a
    priority: P0
    onion: [sample, native, bootstrap]
    touch_paths: ["lab/lispjit-ir/nano_cc.c", "run.sh"]
    accept:
      - "run.sh 0 fail"
      - "plan 无 nano-cc.lisp= 或仅 canonical"
  L4-tu-kickoff:
    assign_role: engineer-b
    priority: P1
    onion: [sample, native, bootstrap]
    touch_paths: ["samples/bootstrap-v35-lisp-tu-link.lisp", "run.sh"]
    accept:
      - "run-bootstrap-v35-lisp-tu-link-plan"
  aarch64-codegen-1:
    assign_role: engineer-a
    priority: P1
    onion: [native, bootstrap]
    depends: [L4-tu-kickoff]
    accept:
      - "新 build-slice-lisp.mode tag"
      - "qemu aarch64 pass"
  L4-runner-1:
    assign_role: engineer-b
    priority: P1
    depends: [L4-tu-kickoff]
    accept:
      - "selfhost gen5 或 documented skip"
  wave-squad-R1:
    assign_role: reviewer
    priority: meta
    accept: ["REFLECTION changelog", "ROADMAP 小组节点"]
  wave-squad-R2:
    assign_role: reviewer
    priority: meta
    accept: ["state 与 assess 同步"]
  wave4-selfhost-refresh:
    assign_role: engineer-a
    priority: P0
    onion: [bootstrap, native]
    touch_paths: ["run.sh", "build_nano_jit.sh"]
    accept:
      - "gen2-slice 可 build-slice-lisp add x86"
      - "或 REFLECTION 记录 gen2 阻塞原因"
  wave4-signoff-bootstrap:
    assign_role: engineer-b
    priority: P0
    onion: [sample, bootstrap, native]
    touch_paths:
      - "samples/bootstrap-v35-signoff-evidence.lisp"
      - "run.sh"
    accept:
      - "run-bootstrap-v35-signoff-evidence-plan"
      - "plan 日志含 v35.signoff markers"
  wave-squad-R3:
    assign_role: reviewer
    priority: meta
    depends: [wave4-selfhost-refresh, wave4-signoff-bootstrap]
    accept:
      - "REFLECTION wave-4 实践反思"
      - "findings 与 assess 一致"
      - "SQUAD.md sync-md"

verify:
  commands:
    - script: run.sh
      cwd: .
      fail_on_nonzero: true
    - script: build_nano_jit.sh
      cwd: .
      env:
        NANO_SELFHOST_THOROUGH: "1"
        NANO_SLICE_COMPILER: native
      optional: true
      fail_on_nonzero: true

sync:
  board:
    file: v3.5/SQUAD.md
    template: board
    begin: "<!-- SQUAD_STATE_BEGIN -->"
    end: "<!-- SQUAD_STATE_END -->"
  reflection:
    file: v3.5/REFLECTION.md
    template: changelog_row
    changelog_anchor: "## 6. 变更日志\n\n| 日期 | 摘要 |\n|------|------|\n"
