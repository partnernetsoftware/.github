# v3.5 签收清单 — 机器可读（squad/v2）
apiVersion: squad/v2
project:
  root: ..
  state_db: .squad/state.db
  state_file: .squad/state.json
locking:
  backend: sqlite
  busy_timeout_ms: 30000
  retry:
    max_attempts: 10
    backoff_base_ms: 50
    backoff_max_ms: 2000
roles:
  reviewer: { kind: meta, workflow: reviewer }
  commander: { kind: orchestrator, workflow: commander }
  engineer-a: { kind: worker, workflow: worker }
  engineer-b: { kind: worker, workflow: worker }
dispatch:
  assign_to: [engineer-a, engineer-b]
  max_per_wave: 2
signoff:
  id: v3.5-lisp-only
  percent_cap: 100
  gates:
    - id: gen5-no-c
      check: artifact
      path_glob: "samples/bootstrap-v35-selfhost-gen5.lisp"
      plan_must_not_match: '\\.c'
    - id: gen5-dual-arch-pack
      check: artifact
      path_glob: "samples/bootstrap-v35-selfhost-gen5.lisp"
      plan_must_match: 'build-slice-lisp'
      plan_must_not_match: 'genesis/nano-jit'
    - id: l4-tu-link
      check: artifact
      path_glob: "samples/bootstrap-v35-lisp-tu-link.lisp"
    - id: tests-run
      check: results
      file: ".build/results.txt"
      results_key: tests.pass
      min_pass: 253
    - id: tests-build
      check: results
      file: ".build/nano-jit/bootstrap-report.txt"
      results_key: build.pass
      min_pass: 119
  # 人工签收（assess 会 WARN，指挥长须在 state 里显式 ack）
  manual_gates:
    - id: aarch64-real-codegen
      description: "aarch64 非仅 exit-stub"
    - id: l4-full-runner-slice
      description: "gen5 由全功能 Lisp slice 跑 plan"

tasks:
  L2-companion:
    assign_role: engineer-a
    priority: P0
    onion: [sample, native, bootstrap]
    touch_paths: ["lab/lispjit-ir/nano_cc.c", "run.sh"]
    accept:
      - "run.sh 0 fail"
      - "plan 无 nano-cc.lisp= 或仅 canonical"
  L4-tu-kickoff:
    assign_role: engineer-b
    priority: P1
    onion: [sample, native, bootstrap]
    touch_paths: ["samples/bootstrap-v35-lisp-tu-link.lisp", "run.sh"]
    accept:
      - "run-bootstrap-v35-lisp-tu-link-plan"
  aarch64-codegen-1:
    assign_role: engineer-a
    priority: P1
    onion: [native, bootstrap]
    depends: [L4-tu-kickoff]
    accept:
      - "新 build-slice-lisp.mode tag"
      - "qemu aarch64 pass"
  L4-runner-1:
    assign_role: engineer-b
    priority: P1
    depends: [L4-tu-kickoff]
    accept:
      - "selfhost gen5 或 documented skip"
  wave-squad-R1:
    assign_role: reviewer
    priority: meta
    accept: ["REFLECTION changelog", "ROADMAP 小组节点"]
  wave-squad-R2:
    assign_role: reviewer
    priority: meta
    accept: ["state 与 assess 同步"]

verify:
  commands:
    - script: lab/nano-lisp-jit/run.sh
      cwd: .
      fail_on_nonzero: true
    - script: lab/nano-lisp-jit/build_nano_jit.sh
      cwd: .
      env:
        NANO_SELFHOST_THOROUGH: "1"
        NANO_SLICE_COMPILER: native
      optional: true
      fail_on_nonzero: true

sync:
  board:
    file: lab/nano-lisp-jit/v3.5/SQUAD.md
    template: board
    begin: "<!-- SQUAD_STATE_BEGIN -->"
    end: "<!-- SQUAD_STATE_END -->"
  reflection:
    file: lab/nano-lisp-jit/v3.5/REFLECTION.md
    template: changelog_row
    changelog_anchor: "## 6. 变更日志\n\n| 日期 | 摘要 |\n|------|------|\n"
