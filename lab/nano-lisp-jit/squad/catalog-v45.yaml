# v4.5 tier0–1 — plan-only verify (与 v4 catalog 分离)
apiVersion: squad/v2
project:
  root: ..
  state_db: .squad/state-v45.db
  state_file: .squad/state-v45.json
signoff:
  id: v45-tier1-verify
  require_terminal: false
  gates:
    - id: v45-decision-doc
      check: artifact
      path_glob: "v4.5/DECISION.md"
    - id: v45-readme
      check: artifact
      path_glob: "v4.5/README.md"
    - id: v45-entry-plan
      check: artifact
      path_glob: "samples/bootstrap-v45-entry.lisp"
      plan_must_not_match: '\\.c'
    - id: v45-verify-smoke-plan
      check: artifact
      path_glob: "samples/bootstrap-v45-verify-smoke.lisp"
      plan_must_not_match: '\\.c'
    - id: v45-verify-core-plan
      check: artifact
      path_glob: "samples/bootstrap-v45-verify-core.lisp"
      plan_must_not_match: '\\.c'
    - id: v45-v4-handoff-plan
      check: artifact
      path_glob: "samples/bootstrap-v45-v4-handoff.lisp"
      plan_must_not_match: '\\.c'
    - id: v45-verify-all-plan
      check: artifact
      path_glob: "samples/bootstrap-v45-verify-all.lisp"
      plan_must_not_match: '\\.c'
    - id: v45-entry-evidence
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.entry.ok
      min_pass: 1
    - id: v45-verify-plan-only
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.verify.plan_only
      min_pass: 1
    - id: v45-verify-com-only
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.verify.com_only
      min_pass: 1
    - id: v35-regression-run
      check: results
      file: ".build/results.txt"
      results_key: tests.pass
      min_pass: 1297
