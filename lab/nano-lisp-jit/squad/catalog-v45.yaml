# v4.5 scoped 100% — onion TDD via *.lisp + nano-jit.com
apiVersion: squad/v2
project:
  root: ..
  state_db: .squad/state-v45.db
  state_file: .squad/state-v45.json
locking:
  backend: sqlite
roles:
  reviewer: { kind: meta, workflow: reviewer }
  commander: { kind: orchestrator, workflow: commander }
  engineer-a: { kind: worker, workflow: worker }
  engineer-b: { kind: worker, workflow: worker }
dispatch:
  assign_to: [engineer-a, engineer-b]
  max_per_wave: 2
supervisor:
  team_mode: true
  auto_exec: false
  auto_done: false
  timeout_sec: 3600
  poll_interval_sec: 10
  max_waves: 20
signoff:
  id: v45-scoped-100
  require_terminal: false
  gates:
    - id: v45-decision-doc
      check: artifact
      path_glob: "v4.5/DECISION.md"
    - id: v45-onion-tdd-doc
      check: artifact
      path_glob: "v4.5/ONION-TDD.md"
    - id: v45-progress-doc
      check: artifact
      path_glob: "v4.5/PROGRESS.md"
    - id: v45-eval-doc
      check: artifact
      path_glob: "v4.5/EVAL.md"
    - id: v45-reflection-doc
      check: artifact
      path_glob: "v4.5/REFLECTION.md"
    - id: v45-structure-doc
      check: artifact
      path_glob: "STRUCTURE.md"
    - id: v45-onion-tdd-plan
      check: artifact
      path_glob: "samples/bootstrap-v45-onion-tdd.lisp"
      plan_must_not_match: '\\.c'
    - id: v45-terminal-done-plan
      check: artifact
      path_glob: "samples/bootstrap-v45-terminal-done.lisp"
    - id: v45-boundary-readme
      check: artifact
      path_glob: "samples/boundary/README.md"
    - id: v45-boundary-negative-plan
      check: artifact
      path_glob: "samples/bootstrap-v45-boundary-negative.lisp"
      plan_must_not_match: '\\.c'
    - id: v45-product-feedback-doc
      check: artifact
      path_glob: "v4.5/PRODUCT-FEEDBACK.md"
    - id: v45-boundary-feedback-plan
      check: artifact
      path_glob: "samples/bootstrap-v45-boundary-feedback.lisp"
      plan_must_not_match: '\\.c'
    - id: v45-boundary-probes
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.boundary.probes
      min_pass: 13
    - id: v45-product-feedback
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.product.feedback
      min_pass: 1
    - id: v45-scoped-100
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.scoped.100
      min_pass: 1
    - id: v45-onion-lisp-only
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.onion.lisp_only
      min_pass: 1
    - id: v45-build-no-host-cc
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.build.no_host_cc
      min_pass: 1
    - id: v45-cleanup-ok
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.cleanup.ok
      min_pass: 1
    - id: v45-parallel-doc
      check: artifact
      path_glob: "v4.5/PARALLEL.md"
    - id: v45-wave1-diffuse
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.wave1.diffuse
      min_pass: 1
    - id: v45-wave1-parallel
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.wave1.parallel
      min_pass: 4
    - id: v45-wave1-rollup
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.wave1.rollup
      min_pass: 1
    - id: v45-selfhost-doc
      check: artifact
      path_glob: "v4.5/SELFHOST.md"
    - id: v45-selfhost-chain-plan
      check: artifact
      path_glob: "samples/bootstrap-v45-selfhost-chain.lisp"
      plan_must_not_match: '\\.c'
    - id: v45-selfhost-lisp-slice
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.selfhost.lisp_slice
      min_pass: 1
    - id: v45-selfhost-regenesis
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.selfhost.regenesis
      min_pass: 1
    - id: v45-selfhost-chain
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.selfhost.chain
      min_pass: 1
    - id: v45-diffuse-wave2-doc
      check: artifact
      path_glob: "v4.5/DIFFUSE-WAVE2.md"
    - id: v45-concurrent-impl-doc
      check: artifact
      path_glob: "v4.5/CONCURRENT-IMPL.md"
    - id: v45-wave2-diffuse
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.wave2.diffuse
      min_pass: 1
    - id: v45-selfhost-modules-full
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.selfhost.modules_full
      min_pass: 1
    - id: v45-selfhost-next-com
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.selfhost.next_com
      min_pass: 1
    - id: v45-wave2-rollup
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.wave2.rollup
      min_pass: 1
    - id: v35-regression-run
      check: results
      file: ".build/results.txt"
      results_key: tests.pass
      min_pass: 1302

tasks:
  wave1-v45-track-a-fine-i64:
    assign_role: engineer-a
    priority: P0
    touch_paths:
      - "samples/bootstrap-v45-boundary-i64.lisp"
      - "samples/boundary/add-i64-chain.lisp"
      - "run.sh"
    accept:
      - "run-bootstrap-v45-boundary-i64-plan"
  wave1-v45-track-a-fine-ptr:
    assign_role: engineer-a
    priority: P0
    touch_paths:
      - "samples/bootstrap-v45-boundary-ptr.lisp"
      - "run.sh"
    accept:
      - "run-bootstrap-v45-boundary-ptr-plan"
  wave1-v45-track-a-fine-func:
    assign_role: engineer-a
    priority: P0
    touch_paths:
      - "samples/bootstrap-v45-boundary-func.lisp"
      - "samples/boundary/func-block-vm-gap.lisp"
      - "run.sh"
    accept:
      - "run-bootstrap-v45-boundary-func-plan"
  wave1-v45-track-a-fine-rodata:
    assign_role: engineer-a
    priority: P0
    touch_paths:
      - "samples/bootstrap-v45-boundary-rodata.lisp"
      - "run.sh"
    accept:
      - "run-bootstrap-v45-boundary-rodata-plan"
  wave1-v45-track-b-diffuse:
    assign_role: engineer-b
    priority: P0
    touch_paths:
      - "samples/bootstrap-v45-diffuse-global.lisp"
      - "v4.5/PARALLEL.md"
      - "run.sh"
    accept:
      - "run-bootstrap-v45-diffuse-global-plan"
      - "run-bootstrap-v45-wave1-diffuse-tick-plan"
  wave1-v45-track-c-parallel:
    assign_role: engineer-b
    priority: P0
    touch_paths:
      - "samples/bootstrap-v45-onion-parallel-matrix.lisp"
      - "scripts/v45-com-verify.sh"
      - "run.sh"
    accept:
      - "run-bootstrap-v45-onion-parallel-matrix-plan"
      - "run-bootstrap-v45-wave1-parallel-tick-plan"
      - "run-bootstrap-v45-wave1-parallel-fine-plan"
  wave1-v45-track-d-assess:
    assign_role: reviewer
    priority: P0
    touch_paths:
      - "v4.5/EVAL.md"
      - "v4.5/REFLECTION.md"
      - "run.sh"
    accept:
      - "run-bootstrap-v45-wave1-assess-tick-plan"
  wave1-v45-R:
    assign_role: reviewer
    priority: meta
    depends:
      - wave1-v45-track-a-fine-i64
      - wave1-v45-track-a-fine-ptr
      - wave1-v45-track-a-fine-func
      - wave1-v45-track-a-fine-rodata
      - wave1-v45-track-b-diffuse
      - wave1-v45-track-c-parallel
      - wave1-v45-track-d-assess
    accept:
      - "run-bootstrap-v45-wave1-rollup-plan"
      - "v45-com-verify done"

  wave2-v45-track-a-selfhost-full:
    assign_role: engineer-a
    priority: P0
    touch_paths:
      - "samples/bootstrap-v45-selfhost-modules-full.lisp"
      - "samples/bootstrap-v45-selfhost-next-com-verify.lisp"
      - "v4.5/SELFHOST.md"
    accept:
      - "run-bootstrap-v45-selfhost-modules-full-plan"
  wave2-v45-track-b-factory-matrix:
    assign_role: engineer-b
    priority: P0
    touch_paths:
      - "samples/bootstrap-v45-factory-matrix.lisp"
      - "samples/bootstrap-v45-wave2-diffuse-global.lisp"
      - "v4.5/DIFFUSE-WAVE2.md"
      - "v4.5/CONCURRENT-IMPL.md"
    accept:
      - "run-bootstrap-v45-factory-matrix-plan"
      - "run-bootstrap-v45-wave2-diffuse-global-plan"
  wave2-v45-track-c-converge:
    assign_role: engineer-b
    priority: P0
    touch_paths:
      - "scripts/v45-wave2-converge.sh"
      - "scripts/v45-com-verify.sh"
      - "run.sh"
    accept:
      - "run-bootstrap-v45-wave2-converge-script-plan"
  wave2-v45-track-d-assess:
    assign_role: reviewer
    priority: P0
    touch_paths:
      - "v4.5/EVAL.md"
      - "v4.5/REFLECTION.md"
      - "v4.5/PARALLEL.md"
    accept:
      - "run-bootstrap-v45-wave2-assess-tick-plan"
  wave2-v45-R:
    assign_role: reviewer
    priority: meta
    depends:
      - wave2-v45-track-a-selfhost-full
      - wave2-v45-track-b-factory-matrix
      - wave2-v45-track-c-converge
      - wave2-v45-track-d-assess
    accept:
      - "run-bootstrap-v45-wave2-rollup-plan"
      - "v45-wave2-converge done"

    - id: v45-wave3-diffuse-doc
      check: artifact
      path_glob: "v4.5/DIFFUSE-WAVE3.md"
    - id: v45-lisp-only-regenesis
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.lisp_only.regenesis
      min_pass: 1
    - id: v45-factory-converge
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.factory.converge
      min_pass: 1
    - id: v45-wave3-plans
      check: results
      file: ".build/v45-entry.evidence"
      results_key: v45.wave3.plans
      min_pass: 25

verify:
  commands:
    - script: scripts/v45-wave3-converge.sh
      cwd: .
      fail_on_nonzero: true

sync:
  board:
    file: v4.5/SQUAD.md
    template: board
    begin: "<!-- SQUAD_STATE_BEGIN -->"
    end: "<!-- SQUAD_STATE_END -->"
